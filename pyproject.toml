[project]
name = "ascii-art"
version = "1.0.0"
description = "Convert images (.png/.jpg/.jpeg/.webp) into ASCII-art text-images via a tkinter GUI."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "MichalS16" },
]
dependencies = [
    "customtkinter",
    "pillow",
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
ascii-art = "ascii_art.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ascii_art"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ascii_art"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# widget constructors take many keyword args on one line; splitting them
# hurts readability more than the line length does
"src/ascii_art/user_interface.py" = ["E501"]
